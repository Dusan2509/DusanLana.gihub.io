<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dušan & Lana · Romantično</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f4ee;--surface:#fffdf9;--parchment:#efe8db;
  --gold:#b8975a;--gold-lt:#d4b47c;
  --ink:#2a2018;--ink-mid:#6b5a46;--ink-lt:#9e8b74;
}
body{background:var(--bg);color:var(--ink);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden}

/* HEADER */
.header{text-align:center;padding:3.5rem 1.5rem 2.5rem;background:var(--surface);border-bottom:1px solid var(--parchment)}
.orn{display:flex;align-items:center;justify-content:center;gap:1rem;margin-bottom:1.2rem}
.orn-line{height:1px;width:55px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn-line.r{background:linear-gradient(90deg,var(--gold),transparent)}
.orn-dot{width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}
.names{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:clamp(2.6rem,8vw,4.5rem);color:var(--ink);letter-spacing:-0.01em;line-height:1;margin-bottom:.6rem}
.names em{color:var(--gold);font-style:normal}
.date{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-lt);font-weight:400;margin-bottom:2rem}
.tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:var(--ink-mid)}

/* UPLOAD */
.upload-section{max-width:460px;margin:0 auto;padding:2.5rem 1.5rem 1.5rem}
.sec-label{text-align:center;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-lt);font-weight:400;margin-bottom:1.2rem}

/* FORMAT PICKER */
.format-picker{display:flex;gap:10px;margin-bottom:1.4rem;justify-content:center}
.fmt-btn{flex:1;max-width:110px;border:1px solid var(--parchment);background:var(--surface);border-radius:3px;padding:10px 6px;text-align:center;cursor:pointer;transition:all .2s;font-family:'Jost',sans-serif}
.fmt-btn:hover{border-color:var(--gold-lt)}
.fmt-btn.active{border-color:var(--gold);background:#fdf8f0}
.fmt-icon{width:100%;margin:0 auto 6px;background:var(--parchment);border-radius:1px}
.fmt-icon.classic{height:52px;width:44px;margin:0 auto 6px}
.fmt-icon.landscape{height:36px;width:56px;margin:0 auto 6px}
.fmt-icon.portrait{height:60px;width:40px;margin:0 auto 6px}
.fmt-label{font-size:11px;color:var(--ink-mid);letter-spacing:.05em}

.drop-zone{border:1px solid var(--gold-lt);background:var(--surface);border-radius:4px;padding:2rem 1.5rem;text-align:center;cursor:pointer;transition:all .25s;position:relative}
.drop-zone::before{content:'';position:absolute;inset:4px;border:1px solid var(--parchment);border-radius:2px;pointer-events:none}
.drop-zone:hover{border-color:var(--gold)}
.drop-zone.dragging{border-color:var(--gold);background:#fdf9f2}
.drop-icon{width:38px;height:38px;margin:0 auto .8rem;border:1px solid var(--gold-lt);border-radius:50%;display:flex;align-items:center;justify-content:center}
.drop-icon svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:1.5}
.drop-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;color:var(--ink);margin-bottom:.3rem}
.drop-hint{font-size:11px;color:var(--ink-lt);letter-spacing:.05em}
#file-input{display:none}

/* PREVIEW */
.preview-wrap{display:none;margin:1.5rem 0 0;text-align:center}
.preview-wrap.visible{display:block}
.pol-preview{display:inline-block;background:var(--surface);box-shadow:0 4px 20px rgba(42,32,24,.12);transform:rotate(-1.5deg)}
.pol-preview img{display:block;object-fit:cover}
.pol-preview .pcap{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--ink-mid);text-align:center;padding:0 6px}

/* format dimensions */
.pol-preview.classic{padding:10px 10px 40px}
.pol-preview.classic img{width:190px;height:190px}
.pol-preview.landscape{padding:10px 10px 36px}
.pol-preview.landscape img{width:220px;height:150px}
.pol-preview.portrait{padding:10px 10px 44px}
.pol-preview.portrait img{width:155px;height:210px}
.pol-preview .pcap{margin-top:8px;min-height:18px}

/* FORM */
.form-row{display:none;gap:8px;margin-top:1rem}
.form-row.visible{display:flex}
.cap-input{flex:1;border:1px solid var(--parchment);background:var(--surface);border-radius:3px;padding:10px 13px;font-family:'Jost',sans-serif;font-size:14px;font-weight:300;color:var(--ink);outline:none;transition:border-color .2s}
.cap-input:focus{border-color:var(--gold)}
.cap-input::placeholder{color:var(--ink-lt)}
.btn-share{background:var(--ink);color:var(--bg);border:none;border-radius:3px;padding:10px 18px;font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.08em;cursor:pointer;transition:background .2s;white-space:nowrap}
.btn-share:hover{background:var(--gold)}
.btn-share:disabled{background:var(--ink-lt);cursor:default}

/* GALLERY */
.gal-header{display:flex;align-items:center;gap:1rem;max-width:700px;margin:2rem auto 1.5rem;padding:0 1.5rem}
.gal-line{flex:1;height:1px;background:var(--parchment)}
.gal-text{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-lt);font-weight:400;white-space:nowrap}
.photo-count{text-align:center;font-size:11px;color:var(--ink-lt);letter-spacing:.1em;margin-bottom:1.5rem}
.gallery{display:flex;flex-wrap:wrap;gap:26px 22px;justify-content:center;padding:0 1.5rem 4rem;max-width:780px;margin:0 auto}

.polaroid{background:var(--surface);box-shadow:0 3px 16px rgba(42,32,24,.1);transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;animation:fadeUp .5s ease both;cursor:default}
.polaroid:nth-child(3n+1){transform:rotate(-2deg)}
.polaroid:nth-child(3n+2){transform:rotate(1.5deg)}
.polaroid:nth-child(3n){transform:rotate(-.7deg)}
.polaroid:hover{transform:rotate(0deg) scale(1.06) !important;box-shadow:0 12px 36px rgba(42,32,24,.16);z-index:10;position:relative}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px) rotate(-3deg)}}

.polaroid.classic{padding:10px 10px 40px}
.polaroid.classic img{width:155px;height:155px}
.polaroid.landscape{padding:10px 10px 34px}
.polaroid.landscape img{width:185px;height:128px}
.polaroid.portrait{padding:10px 10px 42px}
.polaroid.portrait img{width:130px;height:175px}
.polaroid img{object-fit:cover;display:block}
.polaroid .cap{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;color:var(--ink-mid);text-align:center;margin-top:7px;min-height:16px}

.empty{text-align:center;padding:3rem 1.5rem;color:var(--ink-lt)}
.empty p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem}

.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:var(--bg);padding:11px 26px;border-radius:2px;font-size:13px;letter-spacing:.08em;transition:transform .35s cubic-bezier(.34,1.56,.64,1);z-index:999;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

footer{text-align:center;padding:2rem 1.5rem;border-top:1px solid var(--parchment);font-size:10px;letter-spacing:.2em;color:var(--ink-lt);text-transform:uppercase}
</style>
</head>
<body>

<header class="header">
  <div class="orn"><div class="orn-line"></div><div class="orn-dot"></div><div class="orn-line r"></div></div>
  <h1 class="names">Dušan <em>&</em> Lana</h1>
  <p class="date">20. Jun 2026.</p>
  <div class="orn" style="margin-bottom:1.2rem"><div class="orn-line"></div><div class="orn-dot"></div><div class="orn-line r"></div></div>
  <p class="tagline">Podelite vaše trenutke s nama</p>
</header>

<section class="upload-section">
  <p class="sec-label">Izaberi format</p>
  <div class="format-picker">
    <div class="fmt-btn active" data-fmt="classic" onclick="setFormat('classic',this)">
      <div class="fmt-icon classic"></div>
      <div class="fmt-label">Klasični</div>
    </div>
    <div class="fmt-btn" data-fmt="landscape" onclick="setFormat('landscape',this)">
      <div class="fmt-icon landscape"></div>
      <div class="fmt-label">Pejzaž</div>
    </div>
    <div class="fmt-btn" data-fmt="portrait" onclick="setFormat('portrait',this)">
      <div class="fmt-icon portrait"></div>
      <div class="fmt-label">Portret</div>
    </div>
  </div>

  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <div class="drop-icon">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z"/></svg>
    </div>
    <p class="drop-title">Dodaj fotografiju</p>
    <p class="drop-hint">tapni ili prevuci · JPG, PNG, HEIC</p>
  </div>
  <input type="file" id="file-input" accept="image/*"/>

  <div class="preview-wrap" id="preview-wrap">
    <div class="pol-preview classic" id="pol-preview">
      <img id="preview-img" src="" alt="preview"/>
      <div class="pcap" id="preview-cap">dodaj opis...</div>
    </div>
  </div>

  <div class="form-row" id="form-row">
    <input class="cap-input" id="cap-input" type="text" placeholder="Poruka za mladence..." maxlength="50"/>
    <button class="btn-share" id="btn-share">Podeli</button>
  </div>
</section>

<div class="gal-header">
  <div class="gal-line"></div>
  <span class="gal-text">Galerija uspomena</span>
  <div class="gal-line"></div>
</div>
<p class="photo-count" id="photo-count"></p>
<div class="gallery" id="gallery">
  <div class="empty" id="empty-state"><p>Budite prvi koji će podeliti uspomenu</p></div>
</div>

<footer>Dušan &amp; Lana · 20. Jun 2026. ·</footer>
<div class="toast" id="toast"></div>

<script>
let currentFmt = 'classic';
let pendingDataUrl = null;
let count = 0;

function setFormat(fmt, el) {
  currentFmt = fmt;
  document.querySelectorAll('.fmt-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  const preview = document.getElementById('pol-preview');
  preview.className = 'pol-preview ' + fmt;
}

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const previewWrap = document.getElementById('preview-wrap');
const previewImg = document.getElementById('preview-img');
const previewCap = document.getElementById('preview-cap');
const formRow = document.getElementById('form-row');
const capInput = document.getElementById('cap-input');
const btnShare = document.getElementById('btn-share');
const gallery = document.getElementById('gallery');
const photoCount = document.getElementById('photo-count');

function loadPreview(file) {
  const reader = new FileReader();
  reader.onload = e => {
    pendingDataUrl = e.target.result;
    previewImg.src = pendingDataUrl;
    document.getElementById('pol-preview').className = 'pol-preview ' + currentFmt;
    previewCap.textContent = 'dodaj opis...';
    previewWrap.classList.add('visible');
    formRow.classList.add('visible');
    capInput.value = '';
  };
  reader.readAsDataURL(file);
}

fileInput.addEventListener('change', e => { if(e.target.files[0]) loadPreview(e.target.files[0]); });
capInput.addEventListener('input', () => { previewCap.textContent = capInput.value || 'dodaj opis...'; });
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragging'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragging'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragging'); const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')) loadPreview(f); });

btnShare.addEventListener('click', () => {
  if(!pendingDataUrl) return;
  const es = document.getElementById('empty-state');
  if(es) es.remove();
  count++;
  photoCount.textContent = count + ' fotografija podeljeno';
  const el = document.createElement('div');
  el.className = 'polaroid ' + currentFmt;
  el.innerHTML = `<img src="${pendingDataUrl}" alt="wedding photo"/><div class="cap">${capInput.value||''}</div>`;
  gallery.insertBefore(el, gallery.firstChild);
  pendingDataUrl = null;
  previewWrap.classList.remove('visible');
  formRow.classList.remove('visible');
  fileInput.value = '';
  capInput.value = '';
  showToast('Hvala! Fotografija dodata ♥');
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
