<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dušan & Lana · 20. Juni 2026</title>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL, listAll } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ─── REPLACE WITH YOUR FIREBASE CONFIG ────────────────────────────────────
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    // ──────────────────────────────────────────────────────────────────────────

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const db = getFirestore(app);

    window._firebase = { storage, db, ref, uploadBytesResumable, getDownloadURL, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:   #f8f4ee;
      --parchment: #efe8db;
      --gold:    #b8975a;
      --gold-lt: #d4b47c;
      --ink:     #2a2018;
      --ink-mid: #6b5a46;
      --ink-lt:  #9e8b74;
      --white:   #fffdf9;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ─────────────────────────────────────────────────────────── */
    .header {
      text-align: center;
      padding: 4rem 1.5rem 3rem;
      position: relative;
      background: var(--white);
      border-bottom: 1px solid var(--parchment);
    }

    .header::before, .header::after {
      content: '◆';
      position: absolute;
      top: 50%; left: 50%;
      font-size: 6px;
      color: var(--gold-lt);
      transform: translate(-50%, -50%);
    }

    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .ornament-line {
      height: 1px;
      width: 60px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .ornament-line.r { background: linear-gradient(90deg, var(--gold), transparent); }

    .ornament-diamond {
      width: 6px; height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
    }

    .names {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(2.8rem, 9vw, 5rem);
      color: var(--ink);
      letter-spacing: -0.01em;
      line-height: 1;
      margin-bottom: 0.75rem;
    }

    .names span { color: var(--gold); }

    .date-line {
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ink-lt);
      font-weight: 400;
      margin-bottom: 2.5rem;
    }

    .header-tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: var(--ink-mid);
      font-weight: 300;
    }

    /* ── UPLOAD SECTION ─────────────────────────────────────────────────── */
    .upload-section {
      max-width: 480px;
      margin: 0 auto;
      padding: 3rem 1.5rem 2rem;
    }

    .section-label {
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--ink-lt);
      font-weight: 400;
      margin-bottom: 1.5rem;
    }

    .drop-zone {
      border: 1px solid var(--gold-lt);
      background: var(--white);
      border-radius: 4px;
      padding: 2.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }

    .drop-zone::before {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid var(--parchment);
      border-radius: 2px;
      pointer-events: none;
    }

    .drop-zone:hover {
      border-color: var(--gold);
      background: #fffefb;
    }

    .drop-zone.dragging {
      border-color: var(--gold);
      background: #fdf9f2;
    }

    .drop-icon {
      width: 40px; height: 40px;
      margin: 0 auto 1rem;
      border: 1px solid var(--gold-lt);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    .drop-icon svg { width: 18px; height: 18px; stroke: var(--gold); fill: none; stroke-width: 1.5; }

    .drop-title {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--ink);
      margin-bottom: 0.3rem;
    }

    .drop-hint {
      font-size: 12px;
      color: var(--ink-lt);
      letter-spacing: 0.05em;
    }

    #file-input { display: none; }

    /* ── PREVIEW ────────────────────────────────────────────────────────── */
    .preview-wrap {
      display: none;
      margin: 1.5rem 0 0;
      text-align: center;
    }

    .preview-wrap.visible { display: block; }

    .polaroid-preview {
      display: inline-block;
      background: var(--white);
      padding: 10px 10px 42px;
      box-shadow: 0 4px 20px rgba(42,32,24,0.12), 0 1px 4px rgba(42,32,24,0.08);
      transform: rotate(-1.5deg);
    }

    .polaroid-preview img {
      width: 200px; height: 160px;
      object-fit: cover;
      display: block;
    }

    .polaroid-preview .pcap {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 13px;
      color: var(--ink-mid);
      text-align: center;
      margin-top: 8px;
      min-height: 18px;
    }

    /* ── CAPTION + SUBMIT ───────────────────────────────────────────────── */
    .form-row {
      display: none;
      gap: 10px;
      margin-top: 1.2rem;
    }

    .form-row.visible { display: flex; }

    .caption-input {
      flex: 1;
      border: 1px solid var(--parchment);
      background: var(--white);
      border-radius: 3px;
      padding: 10px 14px;
      font-family: 'Jost', sans-serif;
      font-size: 14px;
      font-weight: 300;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s;
    }

    .caption-input:focus { border-color: var(--gold); }
    .caption-input::placeholder { color: var(--ink-lt); }

    .btn-submit {
      background: var(--ink);
      color: var(--cream);
      border: none;
      border-radius: 3px;
      padding: 10px 20px;
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.08em;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-submit:hover { background: var(--gold); }
    .btn-submit:disabled { background: var(--ink-lt); cursor: default; }

    /* ── PROGRESS ───────────────────────────────────────────────────────── */
    .progress-wrap {
      display: none;
      margin-top: 1rem;
    }

    .progress-wrap.visible { display: block; }

    .progress-bar-bg {
      height: 2px;
      background: var(--parchment);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s;
    }

    .progress-label {
      font-size: 11px;
      color: var(--ink-lt);
      letter-spacing: 0.1em;
      text-align: center;
      margin-top: 6px;
    }

    /* ── DIVIDER ────────────────────────────────────────────────────────── */
    .gallery-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      max-width: 700px;
      margin: 1rem auto 2rem;
      padding: 0 1.5rem;
    }

    .gallery-header-line { flex: 1; height: 1px; background: var(--parchment); }

    .gallery-header-text {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ink-lt);
      font-weight: 400;
      white-space: nowrap;
    }

    .photo-count {
      text-align: center;
      font-size: 12px;
      color: var(--ink-lt);
      letter-spacing: 0.1em;
      margin-bottom: 2rem;
    }

    /* ── GALLERY ────────────────────────────────────────────────────────── */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 28px 24px;
      justify-content: center;
      padding: 0 1.5rem 4rem;
      max-width: 760px;
      margin: 0 auto;
    }

    .polaroid {
      background: var(--white);
      padding: 10px 10px 38px;
      box-shadow: 0 3px 16px rgba(42,32,24,0.1), 0 1px 3px rgba(42,32,24,0.06);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s;
      animation: fadeUp 0.5s ease both;
      cursor: default;
    }

    .polaroid:nth-child(3n+1) { transform: rotate(-2deg); }
    .polaroid:nth-child(3n+2) { transform: rotate(1.5deg); }
    .polaroid:nth-child(3n)   { transform: rotate(-0.7deg); }

    .polaroid:hover {
      transform: rotate(0deg) scale(1.06) !important;
      box-shadow: 0 12px 40px rgba(42,32,24,0.18);
      z-index: 10;
      position: relative;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px) rotate(-3deg); }
    }

    .polaroid img {
      width: 160px; height: 130px;
      object-fit: cover;
      display: block;
    }

    .polaroid .cap {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 12.5px;
      color: var(--ink-mid);
      text-align: center;
      margin-top: 8px;
      min-height: 16px;
    }

    /* ── EMPTY STATE ────────────────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--ink-lt);
    }

    .empty-state p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.2rem;
    }

    /* ── TOAST ──────────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--ink);
      color: var(--cream);
      padding: 12px 28px;
      border-radius: 2px;
      font-size: 13px;
      letter-spacing: 0.08em;
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
      z-index: 999;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── LOADING SPINNER ────────────────────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 1.5px solid var(--parchment);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FOOTER ─────────────────────────────────────────────────────────── */
    .footer {
      text-align: center;
      padding: 2rem 1.5rem;
      border-top: 1px solid var(--parchment);
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--ink-lt);
      text-transform: uppercase;
    }

    /* ── RESPONSIVE ─────────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .names { font-size: 3rem; }
      .polaroid img { width: 140px; height: 115px; }
      .gallery { gap: 20px 16px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="ornament">
      <div class="ornament-line"></div>
      <div class="ornament-diamond"></div>
      <div class="ornament-line r"></div>
    </div>
    <h1 class="names">Dušan <span>&</span> Lana</h1>
    <p class="date-line">20. Juni 2026</p>
    <div class="ornament" style="margin-bottom:1.5rem;">
      <div class="ornament-line"></div>
      <div class="ornament-diamond"></div>
      <div class="ornament-line r"></div>
    </div>
    <p class="header-tagline">Podelite vaše trenutke s nama</p>
  </header>

  <!-- UPLOAD -->
  <section class="upload-section">
    <p class="section-label">Dodaj fotografiju</p>

    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div class="drop-icon">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"/></svg>
      </div>
      <p class="drop-title">Dodaj svoju fotografiju</p>
      <p class="drop-hint">tapni ili prevuci ovde · JPG, PNG, HEIC</p>
    </div>

    <input type="file" id="file-input" accept="image/*" multiple />

    <div class="preview-wrap" id="preview-wrap">
      <div class="polaroid-preview" id="preview-polaroid">
        <img id="preview-img" src="" alt="preview" />
        <div class="pcap" id="preview-cap">dodaj opis...</div>
      </div>
    </div>

    <div class="form-row" id="form-row">
      <input class="caption-input" id="caption-input" type="text" placeholder="Poruka za mladence..." maxlength="50" />
      <button class="btn-submit" id="btn-submit">Podeli</button>
    </div>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
      <p class="progress-label" id="progress-label">Uploading...</p>
    </div>
  </section>

  <!-- GALLERY HEADER -->
  <div class="gallery-header">
    <div class="gallery-header-line"></div>
    <span class="gallery-header-text">Galerija uspomena</span>
    <div class="gallery-header-line"></div>
  </div>
  <p class="photo-count" id="photo-count"></p>

  <!-- GALLERY -->
  <div class="gallery" id="gallery">
    <div class="empty-state" id="empty-state">
      <p>Budite prvi koji će podeliti uspomenu</p>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">Dušan &amp; Lana · 20. Juni 2026 · Uvek zajedno</footer>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    // ─── FIREBASE INTEGRATION ─────────────────────────────────────────────────
    // Wait for Firebase module to load
    let firebaseReady = false;
    let pendingDataUrl = null;
    let pendingFile = null;

    function waitForFirebase(cb) {
      if (window._firebase) { firebaseReady = true; cb(); }
      else { setTimeout(() => waitForFirebase(cb), 100); }
    }

    waitForFirebase(() => {
      const { db, collection, onSnapshot, query, orderBy } = window._firebase;
      // Real-time listener for photos
      const q = query(collection(db, 'wedding_photos'), orderBy('timestamp', 'desc'));
      onSnapshot(q, snap => {
        snap.docChanges().forEach(change => {
          if (change.type === 'added') {
            const d = change.doc.data();
            addPolaroidToGallery(d.url, d.caption, true);
          }
        });
      });
    });

    // ─── DOM REFS ─────────────────────────────────────────────────────────────
    const dropZone     = document.getElementById('drop-zone');
    const fileInput    = document.getElementById('file-input');
    const previewWrap  = document.getElementById('preview-wrap');
    const previewImg   = document.getElementById('preview-img');
    const previewCap   = document.getElementById('preview-cap');
    const formRow      = document.getElementById('form-row');
    const captionInput = document.getElementById('caption-input');
    const btnSubmit    = document.getElementById('btn-submit');
    const progressWrap = document.getElementById('progress-wrap');
    const progressFill = document.getElementById('progress-fill');
    const progressLbl  = document.getElementById('progress-label');
    const gallery      = document.getElementById('gallery');
    const emptyState   = document.getElementById('empty-state');
    const photoCount   = document.getElementById('photo-count');
    const toast        = document.getElementById('toast');

    let totalPhotos = 0;

    // ─── GALLERY ──────────────────────────────────────────────────────────────
    function addPolaroidToGallery(url, caption, prepend = false) {
      if (emptyState) emptyState.remove();
      totalPhotos++;
      photoCount.textContent = totalPhotos + (totalPhotos === 1 ? ' fotografija' : ' fotografija podeljeno');

      const el = document.createElement('div');
      el.className = 'polaroid';
      el.style.animationDelay = '0ms';
      el.innerHTML = `<img src="${url}" alt="wedding photo" loading="lazy" /><div class="cap">${caption || ''}</div>`;
      if (prepend && gallery.firstChild) gallery.insertBefore(el, gallery.firstChild);
      else gallery.appendChild(el);
    }

    // ─── FILE HANDLING ────────────────────────────────────────────────────────
    function loadPreview(file) {
      pendingFile = file;
      const reader = new FileReader();
      reader.onload = e => {
        pendingDataUrl = e.target.result;
        previewImg.src = pendingDataUrl;
        previewCap.textContent = 'dodaj opis...';
        previewWrap.classList.add('visible');
        formRow.classList.add('visible');
        captionInput.value = '';
      };
      reader.readAsDataURL(file);
    }

    fileInput.addEventListener('change', e => { if (e.target.files[0]) loadPreview(e.target.files[0]); });

    captionInput.addEventListener('input', () => {
      previewCap.textContent = captionInput.value || 'dodaj opis...';
    });

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragging'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragging'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragging');
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) loadPreview(f);
    });

    // ─── SUBMIT / UPLOAD ──────────────────────────────────────────────────────
    btnSubmit.addEventListener('click', async () => {
      if (!pendingFile) return;

      if (!firebaseReady || !window._firebase) {
        // Demo mode (no Firebase configured yet)
        addPolaroidToGallery(pendingDataUrl, captionInput.value, true);
        resetForm();
        showToast('Fotografija dodata! (demo režim)');
        return;
      }

      const { storage, db, ref, uploadBytesResumable, getDownloadURL, collection, addDoc, serverTimestamp } = window._firebase;

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span class="spinner"></span>';
      progressWrap.classList.add('visible');

      const filename = `photos/${Date.now()}_${pendingFile.name}`;
      const storageRef = ref(storage, filename);
      const uploadTask = uploadBytesResumable(storageRef, pendingFile);

      uploadTask.on('state_changed',
        snap => {
          const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
          progressFill.style.width = pct + '%';
          progressLbl.textContent = pct + '%';
        },
        err => {
          console.error(err);
          showToast('Greška pri uploadu. Pokušajte ponovo.');
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Podeli';
          progressWrap.classList.remove('visible');
        },
        async () => {
          const url = await getDownloadURL(uploadTask.snapshot.ref);
          await addDoc(collection(db, 'wedding_photos'), {
            url,
            caption: captionInput.value,
            timestamp: serverTimestamp()
          });
          resetForm();
          showToast('Hvala! Fotografija je podeljena');
        }
      );
    });

    function resetForm() {
      pendingFile = null;
      pendingDataUrl = null;
      previewWrap.classList.remove('visible');
      formRow.classList.remove('visible');
      progressWrap.classList.remove('visible');
      progressFill.style.width = '0%';
      btnSubmit.disabled = false;
      btnSubmit.textContent = 'Podeli';
      fileInput.value = '';
      captionInput.value = '';
    }

    // ─── TOAST ────────────────────────────────────────────────────────────────
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
